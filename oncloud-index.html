<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>קטלוג On Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:'Heebo',system-ui,sans-serif;color:#17140f;background:#fbfaf8;-webkit-font-smoothing:antialiased}
  img{display:block}
  .top{background:#1a1815;color:#fff;padding:0 20px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
  .brandline{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:800;letter-spacing:-.3px;padding:10px 0}
  .dot{width:9px;height:9px;background:#E2480F;border-radius:50%}
  .stats{display:flex;gap:8px;padding:8px 0}
  .stat{text-align:center;background:rgba(255,255,255,.07);border-radius:9px;padding:5px 13px;min-width:62px}
  .stat .l{color:#9a948c;font-size:9px;display:block;line-height:1;margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
  .stat .v{font-size:14px;font-weight:700}
  .stat.acc{background:rgba(29,111,66,.22)}
  .stat.acc .l{color:#8fcfa8}
  .stat.acc .v{color:#a8e6c0}
  .bar{background:#fff;border-bottom:1px solid #e9e5df;padding:11px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:58px;z-index:98}
  .pill{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1.5px solid #e9e5df;border-radius:20px;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#17140f;white-space:nowrap;font-family:inherit}
  .pill.on{background:#17140f;color:#fff;border-color:#17140f}
  .search{position:relative;margin-right:auto}
  .search input{padding:8px 34px 8px 13px;border:1.5px solid #e9e5df;border-radius:20px;font-size:12px;font-weight:500;background:#fff;color:#17140f;width:200px;font-family:inherit;outline:none}
  .search input:focus{border-color:#17140f}
  .search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;color:#a8a29a;pointer-events:none}
  .wrap{display:flex;align-items:flex-start;min-height:400px}
  .main{flex:1;padding:20px;min-width:0}
  .count{font-size:12px;color:#6b6660;margin-bottom:16px;font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
  .card{background:#fff;border:1px solid #ece8e2;border-radius:14px;overflow:hidden;transition:box-shadow .2s,border-color .2s}
  .card:hover{box-shadow:0 8px 26px rgba(0,0,0,.1);border-color:#ddd6cc}
  .ph{position:relative;height:224px;overflow:hidden;background:#fff}
  .ph img{width:100%;height:100%;object-fit:contain;padding:14px;transition:transform .5s ease}
  .card:hover .ph img{transform:scale(1.04)}
  .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f0ece6,#e3ddd4);color:#c3bdb4;font-size:46px}
  .cb{padding:14px;text-align:center}
  .bn{font-size:10px;color:#a8a29a;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
  .sku{font-size:15px;font-weight:800;color:#17140f;line-height:1.25;margin-top:2px;letter-spacing:.02em}
  .nm{font-size:11px;color:#6b6660;margin-top:1px}
  .meta{font-size:10px;color:#a8a29a;letter-spacing:.03em;margin-top:5px}
  .sub{font-size:10px;color:#a8a29a;margin-top:6px;margin-bottom:10px}
  .prow{display:flex;align-items:baseline;gap:7px;margin-bottom:11px;flex-wrap:wrap;justify-content:center}
  .price{font-size:18px;font-weight:800;color:#1D6F42}
  hr.sep{border:none;border-top:1px solid #f1eee9;margin:0 0 10px}
  .sh{font-size:10px;color:#6b6660;margin-bottom:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-align:right}
  .snote{font-size:10px;color:#185FA5;background:#E6F1FB;border-radius:7px;padding:5px 9px;margin-bottom:9px;display:flex;align-items:center;gap:5px;font-weight:600;text-align:right}
  .runs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
  .runs span{display:flex;align-items:center;gap:3px;background:#f4f1ec;border:1px solid #e6e1d8;border-radius:6px;padding:2px 6px;font-size:10px}
  .runs b{font-weight:700;color:#17140f}
  .runs i{color:#a8a29a;font-style:normal}
  .runs u{text-decoration:none;font-weight:600;color:#6b6660}
  .srow{display:flex;align-items:center;margin-bottom:6px;gap:7px}
  .srow .lbl{font-size:11px;font-weight:700;flex:1;text-align:right;color:#17140f}
  .step{width:22px;height:22px;border:1.5px solid #e9e5df;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;color:#17140f;font-family:inherit;flex-shrink:0}
  .step:hover{border-color:#17140f;background:#17140f;color:#fff}
  .qty{font-size:11px;font-weight:700;min-width:18px;text-align:center}
  .addbtn{width:100%;padding:10px;background:#17140f;color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;margin-top:11px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
  .addbtn:hover{background:#1D6F42}
  .inb{font-size:10px;color:#1D6F42;font-weight:700;margin-top:7px}
  .cart{width:270px;background:#fff;border-right:1px solid #e9e5df;padding:18px;flex-shrink:0;position:sticky;top:110px;max-height:calc(100vh - 110px);overflow-y:auto}
  .ct{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .empty{font-size:12px;color:#a8a29a;text-align:center;padding:36px 0}
  .cgroup{border-bottom:1px solid #f1eee9;padding:9px 0}
  .cg-t{font-size:12px;font-weight:700;color:#17140f}
  .cg-s{font-size:10px;color:#a8a29a;margin-top:1px}
  .cline{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:#6b6660}
  .ctrl{display:flex;align-items:center;gap:3px}
  .cstep{width:18px;height:18px;border:1px solid #e9e5df;border-radius:5px;background:#fff;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;color:#17140f;font-family:inherit}
  .cstep:hover{border-color:#17140f}
  .tot{padding-top:13px;border-top:1px solid #e9e5df;margin-top:13px}
  .tline{display:flex;justify-content:space-between;font-size:12px;color:#6b6660;margin-bottom:5px}
  .tbig{display:flex;justify-content:space-between;font-size:15px;font-weight:800;color:#17140f;border-top:1px solid #e9e5df;padding-top:10px;margin-top:5px}
  .send{width:100%;padding:12px;background:#1D6F42;color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:800;cursor:pointer;margin-top:12px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px}
  .send:hover{background:#175934}
  .fab{display:none}
  @media(max-width:860px){
    .wrap{display:block}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .ph{height:170px}
    .cart{position:fixed;inset:auto 0 0 0;width:100%;max-height:72vh;border-right:none;border-top:1px solid #e9e5df;box-shadow:0 -10px 34px rgba(0,0,0,.16);border-radius:16px 16px 0 0;z-index:200;transform:translateY(102%);transition:transform .25s ease}
    .cart.open{transform:translateY(0)}
    .fab{display:flex;position:fixed;bottom:18px;left:18px;z-index:150;background:#1D6F42;color:#fff;border:none;border-radius:30px;padding:13px 22px;font-size:14px;font-weight:800;font-family:inherit;align-items:center;gap:8px;box-shadow:0 8px 26px rgba(0,0,0,.28);cursor:pointer}
    .bar{top:auto;position:static}
    .search input{width:100%}
    .search{width:100%;margin-right:0}
  }
</style>
</head>

  var WA_NUMBER = '972547973415';
  var SYM = DATA.sym || '₪';
  var cart = [];          // {pid, sizeIdx, qty}
  var filters = { gender: 'הכל', type: 'הכל' };
  var query = '';

  function UP(p){ return p.seriesMode ? Math.round(p.basePrice*(p.seriesPairs||1)*100)/100 : p.basePrice; }
  function UNIT(p){ return p.seriesMode ? 'סדרות' : 'יח׳'; }
  function pairsOf(p, qty){ return qty * (p.seriesMode ? (p.seriesPairs||1) : 1); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

  function uniq(key){
    var out = [];
    DATA.products.forEach(function(p){ var v=p[key]; if(v && out.indexOf(v)<0) out.push(v); });
    return out.sort();
  }

  function renderFilters(){
    var bar = document.getElementById('filterBar');
    var genders = uniq('gender'), types = uniq('type');
    var html = '';
    if (genders.length > 1) {
      html += '<button class="pill'+(filters.gender==='הכל'?' on':'')+'" onclick="setF(\'gender\',\'הכל\')">כל המגדרים</button>';
      genders.forEach(function(g){ html += '<button class="pill'+(filters.gender===g?' on':'')+'" onclick="setF(\'gender\',\''+esc(g)+'\')">'+esc(g)+'</button>'; });
    }
    if (types.length > 1) {
      html += '<span style="width:1px;height:18px;background:#e9e5df;margin:0 4px"></span>';
      html += '<button class="pill'+(filters.type==='הכל'?' on':'')+'" onclick="setF(\'type\',\'הכל\')">כל הסוגים</button>';
      types.forEach(function(t){ html += '<button class="pill'+(filters.type===t?' on':'')+'" onclick="setF(\'type\',\''+esc(t)+'\')">'+esc(t)+'</button>'; });
    }
    html += '<div class="search"><input id="q" placeholder="חיפוש: מק״ט, שם, צבע" oninput="setQ(this.value)" value="'+esc(query)+'"><i class="ti ti-search"></i></div>';
    bar.innerHTML = html;
  }
  function setF(k,v){ filters[k]=v; renderFilters(); render(); }
  function setQ(v){ query=v; render(); }

  function visible(){
    var ql = query.trim().toLowerCase();
    return DATA.products.map(function(p,i){ return {p:p,i:i}; }).filter(function(o){
      var p=o.p;
      if (filters.gender!=='הכל' && p.gender!==filters.gender) return false;
      if (filters.type!=='הכל' && p.type!==filters.type) return false;
      if (ql) {
        var hay = (p.sku+' '+p.name+' '+(p.color||'')).toLowerCase();
        if (hay.indexOf(ql)<0) return false;
      }
      return true;
    });
  }

  function render(){
    var grid = document.getElementById('grid');
    var list = visible();
    document.getElementById('resCount').textContent = list.length + ' מוצרים';
    grid.innerHTML = '';
    list.forEach(function(o){
      var p=o.p, pi=o.i;
      var card = document.createElement('div'); card.className='card';
      var imgHtml = p.img
        ? '<img src="'+p.img+'" alt="'+esc(p.sku)+'">'
        : '<div class="noimg"><i class="ti ti-shoe"></i></div>';
      var runHtml = '';
      if (p.closedRun && p.runSizes && p.runSizes.length) {
        runHtml = '<div class="runs">' + p.runSizes.map(function(rs){
          return '<span><b>'+esc(rs.s)+'</b><i>×</i><u>'+rs.q+'</u></span>';
        }).join('') + '</div>';
      }
      var noteHtml = p.seriesMode
        ? '<div class="snote"><i class="ti ti-stack-2"></i>סדרה = '+(p.seriesPairs||0)+' זוגות · '+SYM+UP(p)+' לסדרה</div>'
        : '';
      var rows = p.sizes.map(function(s,si){
        var lbl = p.seriesMode ? ('סדרה · '+(p.seriesPairs||0)+' זוגות') : (s.s+' ('+s.st+')');
        return '<div class="srow"><span class="lbl">'+esc(lbl)+'</span>'+
          '<button class="step" onclick="chg('+pi+','+si+',-1)">−</button>'+
          '<span class="qty" id="q-'+pi+'-'+si+'">0</span>'+
          '<button class="step" onclick="chg('+pi+','+si+',1)">+</button></div>';
      }).join('');
      card.innerHTML =
        '<div class="ph">'+imgHtml+'</div>'+
        '<div class="cb">'+
          '<div class="bn">'+esc(DATA.brandName)+'</div>'+
          '<div class="sku">'+esc(p.sku)+'</div>'+
          '<div class="nm">'+esc(p.name)+'</div>'+
          '<div class="meta">'+esc(p.gender||'')+(p.seriesPairs?(' · '+p.seriesPairs+' זוגות בסדרה'):'')+'</div>'+
          '<div class="sub">'+esc(p.color||'')+'</div>'+
          '<div class="prow"><span class="price">'+SYM+p.basePrice+'</span></div>'+
          '<hr class="sep">'+
          '<div class="sh">'+(p.closedRun?'סדרה סגורה — חלוקת מידות (EU)':(p.seriesMode?'הזמנה לפי סדרה':'מידות זמינות'))+'</div>'+
          noteHtml + runHtml + rows +
          '<button class="addbtn" onclick="addAll('+pi+')"><i class="ti ti-shopping-cart"></i>'+(p.seriesMode?'הוסף סדרה':'הוסף לעגלה')+'</button>'+
          '<div class="inb" id="inb-'+pi+'"></div>'+
        '</div>';
      grid.appendChild(card);
    });
    syncQtys();
    renderCart();
  }

  var draft = {};   // pid-sizeIdx -> qty (before adding)
  function chg(pi, si, d){
    var key = pi+'-'+si;
    var p = DATA.products[pi];
    var cur = draft[key] || 0;
    var next = cur + d;
    if (next < 0) next = 0;
    if (!p.seriesMode && p.sizes[si].st != null && next > p.sizes[si].st) next = p.sizes[si].st;
    draft[key] = next;
    var el = document.getElementById('q-'+key);
    if (el) el.textContent = next;
  }
  function syncQtys(){
    Object.keys(draft).forEach(function(k){
      var el = document.getElementById('q-'+k);
      if (el) el.textContent = draft[k];
    });
    DATA.products.forEach(function(p,pi){
      var inb = document.getElementById('inb-'+pi);
      if (!inb) return;
      var tot = cart.filter(function(c){return c.pid===pi;}).reduce(function(a,c){return a+c.qty;},0);
      inb.textContent = tot>0 ? ('בעגלה: '+tot+' '+UNIT(p)) : '';
    });
  }
  function addAll(pi){
    var p = DATA.products[pi], any=false;
    p.sizes.forEach(function(s,si){
      var key = pi+'-'+si, q = draft[key]||0;
      if (q>0) {
        var ex = cart.filter(function(c){return c.pid===pi&&c.sizeIdx===si;})[0];
        if (ex) ex.qty += q; else cart.push({pid:pi, sizeIdx:si, qty:q});
        draft[key]=0;
        var el=document.getElementById('q-'+key); if(el) el.textContent='0';
        any=true;
      }
    });
    if (any) { renderCart(); syncQtys(); }
  }
  function cartChg(pid, si, d){
    var ex = cart.filter(function(c){return c.pid===pid&&c.sizeIdx===si;})[0];
    if (!ex) return;
    ex.qty += d;
    if (ex.qty <= 0) cart = cart.filter(function(c){return !(c.pid===pid&&c.sizeIdx===si);});
    renderCart(); syncQtys();
  }

  function renderCart(){
    var body = document.getElementById('cartBody');
    var models = {}, units = 0, total = 0;
    cart.forEach(function(c){ var p=DATA.products[c.pid]; models[c.pid]=1; units += pairsOf(p,c.qty); total += c.qty*UP(p); });
    document.getElementById('stModels').textContent = Object.keys(models).length;
    document.getElementById('stUnits').textContent = units;
    document.getElementById('stTotal').textContent = SYM+Math.round(total*100)/100;
    var fab = document.getElementById('fabTxt');
    if (fab) fab.textContent = cart.length ? ('העגלה · '+SYM+(Math.round(total*100)/100)) : 'העגלה';
    if (!cart.length) { body.innerHTML = '<div class="empty">העגלה ריקה</div>'; return; }
    var byPid = {};
    cart.forEach(function(c){ (byPid[c.pid] = byPid[c.pid] || []).push(c); });
    var html = '';
    Object.keys(byPid).forEach(function(pid){
      var p = DATA.products[pid], group = byPid[pid];
      var gt = group.reduce(function(a,c){return a+c.qty*UP(p);},0);
      var gq = group.reduce(function(a,c){return a+c.qty;},0);
      html += '<div class="cgroup"><div class="cg-t">'+esc(p.sku)+'</div>'+
        '<div class="cg-s">'+esc(p.name)+' · '+gq+' '+UNIT(p)+' · '+SYM+(Math.round(gt*100)/100)+'</div>';
      group.forEach(function(c){
        var s = p.sizes[c.sizeIdx];
        var lbl = p.seriesMode ? ('סדרה · '+(p.seriesPairs||0)+' זוגות') : ('מידה '+s.s);
        html += '<div class="cline"><div class="ctrl">'+
          '<button class="cstep" onclick="cartChg('+c.pid+','+c.sizeIdx+',-1)">−</button>'+
          '<span class="qty">'+c.qty+'</span>'+
          '<button class="cstep" onclick="cartChg('+c.pid+','+c.sizeIdx+',1)">+</button>'+
          '<span style="margin-right:5px">'+esc(lbl)+'</span></div>'+
          '<span style="font-weight:700;color:#17140f">'+SYM+(Math.round(c.qty*UP(p)*100)/100)+'</span></div>';
      });
      html += '</div>';
    });
    html += '<div class="tot">'+
      '<div class="tline"><span>סה״כ זוגות</span><span>'+units+'</span></div>'+
      '<div class="tbig"><span>סה״כ</span><span>'+SYM+(Math.round(total*100)/100)+'</span></div>'+
      '<button class="send" onclick="sendWA()"><i class="ti ti-brand-whatsapp"></i>שלח הזמנה בוואטסאפ</button></div>';
    body.innerHTML = html;
  }

  function openCart(){ document.getElementById('cartPanel').classList.add('open'); }
  function closeCart(){ document.getElementById('cartPanel').classList.remove('open'); }

  function sendWA(){
    if (!cart.length) { alert('העגלה ריקה'); return; }
    var lines = [], total = 0, totalPairs = 0;
    var csvRows = [['מק"ט','שם','מידה / סדרה','כמות','זוגות','מחיר יחידה','סה"כ שורה']];
    cart.forEach(function(c){
      var p = DATA.products[c.pid], s = p.sizes[c.sizeIdx];
      var lt = c.qty * UP(p); total += lt;
      var pairs = pairsOf(p, c.qty); totalPairs += pairs;
      var lbl = p.seriesMode ? ('סדרה ('+(p.seriesPairs||0)+' זוגות)') : ('מידה '+s.s);
      lines.push('• '+p.sku+' '+p.name+' | '+lbl+' ×'+c.qty+' — '+SYM+(Math.round(lt*100)/100));
      csvRows.push([p.sku, p.name, p.seriesMode?('סדרה '+(p.seriesPairs||0)):s.s, c.qty, pairs, UP(p), Math.round(lt*100)/100]);
    });
    csvRows.push(['','','','','','סה"כ', Math.round(total*100)/100]);
    csvRows.push(['','','','סה"כ זוגות', totalPairs, '', '']);
    try {
      var ws = XLSX.utils.aoa_to_sheet(csvRows);
      ws['!cols'] = [{wch:16},{wch:26},{wch:16},{wch:8},{wch:8},{wch:12},{wch:12}];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'הזמנה');
      XLSX.writeFile(wb, 'הזמנה_'+DATA.brandName+'.xlsx');
    } catch(e) {}
    var txt = 'הזמנה מקטלוג '+DATA.brandName+'\n\n'+lines.join('\n')+
      '\n\nסה"כ זוגות: '+totalPairs+'\nסה"כ לתשלום: '+SYM+(Math.round(total*100)/100)+
      '\n\n📎 מצורף קובץ אקסל מסודר (מק"ט/מידה/כמות) — הורד ושלח לי אותו כאן.';
    window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(txt), '_blank');
  }

  renderFilters();
  render();
</script>
</body>
</html>
